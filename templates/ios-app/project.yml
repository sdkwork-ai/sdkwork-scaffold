name: __APP_NAME__
options:
  bundleIdPrefix: __APP_IDENTIFIER__
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  __IOS_MODULE_NAME__:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: __APP_NAME__
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __APP_IDENTIFIER__
